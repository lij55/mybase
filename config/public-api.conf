# API-only entry. Route business API traffic here, not directly to api-gw.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}
# Do not log query strings (may contain tokens) or authorization headers.
log_format api_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
upstream supabase_api {
    zone supabase_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api-gw:8000 resolve;
}
server {
    listen 8080;
    server_tokens off;
    access_log /var/log/nginx/access.log api_safe;
    client_max_body_size 50m;
    # Docker DNS; re-resolve after upstream container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $origin_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control 'no-store' always;

    location = /healthz { access_log off; return 200 'ok\n'; }
    # Do not publish Realtime tenant administration.
    location ^~ /realtime/v1/api { return 404; }
    location ~ ^/(auth/v1/|rest/v1/|storage/v1/|functions/v1/|realtime/v1/) {
        # No URI suffix: preserve escaped object names; location checks use normalized URI.
        proxy_pass http://supabase_api;
    }
    location = /graphql/v1 { proxy_pass http://supabase_api; }
    location / { return 404; }
}
