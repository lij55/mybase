<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>授权管理 · Mybase</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><span class="brand">Mybase / 授权管理</span><span id="identity" class="identity"></span><button id="logout" hidden>退出登录</button></header><main><h1>授权管理</h1><p class="muted">创建共用账号，为每位用户分配应用访问权。</p><div id="message" role="status" aria-live="polite"></div><section id="login" class="card login-card"><h2>登录</h2><form id="login-form"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="sign-in">登录</button></form><p class="muted">使用共用账号登录。账号由授权后台创建。</p></section><div id="workspace" hidden><div class="grid"><section class="card"><h2>创建用户</h2><p class="muted">创建共用登录账号，权限在右侧单独分配。</p><form id="create-user"><label>邮箱<input id="new-email" type="email" required autocomplete="off"></label><label>初始密码<input id="new-password" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="primary" id="create">创建账号</button></form><hr><div class="toolbar"><h2>用户</h2><button id="reload-users">刷新</button></div><div id="users"></div><div class="toolbar pager"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div></section><section class="card"><div class="toolbar"><h2>应用权限</h2><button id="reload-apps">发现应用</button></div><p class="muted" id="selected-user">先从左侧选择用户。</p><div id="permissions"></div><p class="muted">勾选即授予，取消即撤销。新账号默认没有任何应用权限。后台管理资格由部署配置单独控制。</p></section></div></div></main></body></html>
