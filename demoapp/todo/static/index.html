<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo · Mybase</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><span class="brand">Mybase / Todo</span><span id="identity" class="identity"></span><button id="logout" hidden>退出登录</button></header><main><h1>Todo</h1><p class="muted">把要做的事记下来，逐件完成。</p><div id="message" role="status" aria-live="polite"></div><section id="login" class="card login-card"><h2>登录</h2><form id="login-form"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="sign-in">登录</button></form><p class="muted">使用共用账号登录。账号由授权后台创建。</p></section><div id="workspace" hidden><section class="card"><form id="add-item"><label>新任务<input id="content" required maxlength="1000" placeholder="下一件要做的事" autocomplete="off"></label><button id="add" class="primary">添加任务</button></form></section><section class="card"><div class="toolbar"><h2>我的任务</h2><button id="reload">刷新</button></div><ul id="items" class="list"></ul><p id="empty" class="muted" hidden>暂无任务。若添加被拒绝，请联系管理员检查应用授权。</p><p class="muted">最多显示最近 500 条。</p></section></div></main></body></html>
