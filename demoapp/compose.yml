name: mybase-demo

x-app: &app
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - frontend
    - supabase
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 3
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-supabase: &supabase-env
  SUPABASE_URL: ${SUPABASE_URL:-http://api-gw:8000}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in demoapp/.env}

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=mybase-demo-frontend
      - --providers.docker.constraints=Label(`mybase.demo`, `true`)
      - --entrypoints.web.address=:8080
      - --api.dashboard=false
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - '${TRAEFIK_BIND:-127.0.0.1}:${TRAEFIK_PORT:-8090}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
    healthcheck:
      test: [CMD, traefik, healthcheck, --ping]
      interval: 15s
      timeout: 5s
      retries: 3

  admin:
    <<: *app
    image: mybase-demo-admin:local
    build:
      context: .
      dockerfile: admin/Dockerfile
    environment:
      <<: *supabase-env
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in demoapp/.env}
      DATABASE_URL: ${DATABASE_URL:?Set restricted authorization database connection}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:?Set administrator Auth UUIDs}
    labels:
      traefik.enable: 'true'
      mybase.demo: 'true'
      traefik.http.middlewares.demo-admin-limit.ratelimit.average: '20'
      traefik.http.middlewares.demo-admin-limit.ratelimit.burst: '40'
      traefik.http.routers.demo-admin.rule: 'Host(`${ADMIN_HOST:-authz.localhost}`)'
      traefik.http.routers.demo-admin.entrypoints: web
      traefik.http.routers.demo-admin.middlewares: demo-admin-limit@docker
      traefik.http.services.demo-admin.loadbalancer.server.port: '8080'

  todo:
    <<: *app
    image: mybase-demo-todo:local
    build:
      context: .
      dockerfile: todo/Dockerfile
    environment:
      <<: *supabase-env
      APP_SCHEMA: app_todo
    labels:
      traefik.enable: 'true'
      mybase.demo: 'true'
      traefik.http.routers.demo-todo.rule: 'Host(`${TODO_HOST:-todo.localhost}`)'
      traefik.http.routers.demo-todo.entrypoints: web
      traefik.http.routers.demo-todo.middlewares: demo-todo-limit@docker
      traefik.http.middlewares.demo-todo-limit.ratelimit.average: '20'
      traefik.http.middlewares.demo-todo-limit.ratelimit.burst: '40'
      traefik.http.services.demo-todo.loadbalancer.server.port: '8080'

  notes:
    <<: *app
    image: mybase-demo-notes:local
    build:
      context: .
      dockerfile: notes/Dockerfile
    environment:
      <<: *supabase-env
      APP_SCHEMA: app_notes
    labels:
      traefik.enable: 'true'
      mybase.demo: 'true'
      traefik.http.routers.demo-notes.rule: 'Host(`${NOTES_HOST:-notes.localhost}`)'
      traefik.http.routers.demo-notes.entrypoints: web
      traefik.http.routers.demo-notes.middlewares: demo-notes-limit@docker
      traefik.http.middlewares.demo-notes-limit.ratelimit.average: '20'
      traefik.http.middlewares.demo-notes-limit.ratelimit.burst: '40'
      traefik.http.services.demo-notes.loadbalancer.server.port: '8080'

networks:
  frontend:
    name: mybase-demo-frontend
  supabase:
    external: true
    name: ${SUPABASE_DOCKER_NETWORK:-mybase_default}
